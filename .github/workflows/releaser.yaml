name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE_WIDTH: 3000
  IMAGE_HEIGHT: 3000
  IMAGE_ZOOM: 0.75
  OUTPUT_DIR: release
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  check:
    runs-on: ubuntu-24.04 # KiCad 10 PPA builds exist for noble; ubuntu-latest fell back to the distro's KiCad 9
    outputs:
      revision: ${{ steps.revision.outputs.revision }}
      skip: ${{ steps.exists.outputs.skip }}
    steps:
      - uses: actions/checkout@v6

      - name: Extract revision
        id: revision
        run: |
          PROJECT_FILE=$(find . -maxdepth 1 -name "*.kicad_pro" | head -1)
          PCB_FILE="${PROJECT_FILE%.kicad_pro}.kicad_pcb"
          # 1) project text variable REVISION (Project Setup > Text Variables)
          REVISION=$(jq -r '.text_variables.REVISION // empty' "$PROJECT_FILE")
          # 2) otherwise the PCB title block revision (Page Settings > Revision)
          if [ -z "$REVISION" ]; then
            REVISION=$(sed -n 's/.*(rev "\([^"]*\)").*/\1/p' "$PCB_FILE" | head -1)
          fi
          if [ -z "$REVISION" ]; then
            echo "ERROR: no revision found. Set Revision in the PCB's Page Settings, or a REVISION text variable in Project Setup."
            exit 1
          fi
          echo "Revision: $REVISION"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Skip if this revision is already released
        id: exists
        run: |
          if gh release view "Revision-${{ steps.revision.outputs.revision }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${{ steps.revision.outputs.revision }} already exists. Bump REVISION to publish a new one."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.skip == 'false'
    runs-on: ubuntu-24.04 # KiCad 10 PPA builds exist for noble; ubuntu-latest fell back to the distro's KiCad 9
    env:
      REVISION: ${{ needs.check.outputs.revision }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Detect project files
        run: |
          PROJECT_FILE=$(find . -maxdepth 1 -name "*.kicad_pro" | head -1)
          BASE="${PROJECT_FILE%.kicad_pro}"
          echo "PCB_FILE=${BASE}.kicad_pcb" >> "$GITHUB_ENV"
          echo "SCH_FILE=${BASE}.kicad_sch" >> "$GITHUB_ENV"
          mkdir -p "$OUTPUT_DIR"

      - name: Install dependencies
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt update
          sudo apt install kicad -y --no-install-recommends
          # Montserrat is used on the silkscreen; without it gerbers fall back to another font
          sudo apt install -y fonts-open-sans fonts-montserrat xvfb at-spi2-core
          pip3 install InteractiveHtmlBom

      - name: Check KiCad version and project files
        run: |
          KICAD_VERSION=$(kicad-cli version)
          apt-cache policy kicad | head -3
          case "$KICAD_VERSION" in
            10.*) echo "KiCad $KICAD_VERSION" ;;
            *) echo "ERROR: expected KiCad 10, got $KICAD_VERSION (PPA package not installed)"; exit 1 ;;
          esac
          for f in "$SCH_FILE" "$PCB_FILE"; do
            echo "== $f"
            head -4 "$f"
            if head -1 "$f" | grep -q "git-lfs"; then
              echo "ERROR: $f is a Git LFS pointer, not the real file. Enable 'lfs: true' on checkout."
              exit 1
            fi
          done

      # Block the release on errors only; warnings (e.g. silkscreen text) are reported but don't fail.
      - name: Run ERC
        run: |
          kicad-cli sch erc "$SCH_FILE" \
          --severity-error \
          --exit-code-violations \
          --output "$OUTPUT_DIR"/erc.rpt

      - name: Run DRC
        run: |
          kicad-cli pcb drc "$PCB_FILE" \
          --severity-error \
          --schematic-parity \
          --exit-code-violations \
          --output "$OUTPUT_DIR"/drc.rpt

      - name: Generate schematic PDF
        run: |
          kicad-cli sch export pdf "$SCH_FILE" \
          --black-and-white \
          --output "$OUTPUT_DIR"/schematic.pdf

      - name: Generate PCB PDF
        run: |
          kicad-cli pcb export pdf "$PCB_FILE" \
          --output "$OUTPUT_DIR/pcb.pdf" \
          --mode-multipage \
          --include-border-title \
          --sketch-pads-on-fab-layers \
          --layers F.Fab,B.Fab,F.Cu,In1.Cu,In2.Cu,B.Cu,F.Mask,B.Mask \
          --common-layers Edge.Cuts,User.Drawings

      - name: Generate BOM
        run: |
          kicad-cli sch export bom "$SCH_FILE" \
          --output "$OUTPUT_DIR"/bom.csv \
          --fields "Reference,\${QUANTITY},Manufacturer,Manufacturer Part Number" \
          --labels "Reference,Quantity,Manufacturer,Manufacturer Part Number" \
          --group-by "Manufacturer Part Number" \
          --sort-field "Reference"

      - name: Generate gerbers and drill files
        run: |
          # Loose gerbers go to a scratch folder; only the zip goes in the release
          kicad-cli pcb export gerbers "$PCB_FILE" \
          --output build/gerber \
          --layers F.Cu,In1.Cu,In2.Cu,B.Cu,F.Paste,B.Paste,F.Silkscreen,B.Silkscreen,F.Mask,B.Mask,Edge.Cuts
          kicad-cli pcb export drill "$PCB_FILE" \
          --output build/gerber
          # Flat zip (no folders inside), as fab upload forms expect
          zip -j "$OUTPUT_DIR"/gerber.zip build/gerber/*

      - name: Generate ODB++
        run: |
          kicad-cli pcb export odb "$PCB_FILE" \
          --output "$OUTPUT_DIR"/odb++.zip

      - name: Generate netlist
        run: |
          kicad-cli sch export netlist "$SCH_FILE" \
          --output "$OUTPUT_DIR"/netlist.net

      - name: Generate interactive HTML BOM
        run: |
          xvfb-run --auto-servernum \
          generate_interactive_bom "$PCB_FILE" \
          --extra-data-file "$OUTPUT_DIR"/netlist.net \
          --show-fields "Manufacturer,Manufacturer Part Number" \
          --group-fields "Manufacturer Part Number" \
          --dark-mode \
          --highlight-pin1 all \
          --include-tracks \
          --include-nets \
          --show-fabrication \
          --checkboxes Placed \
          --no-browser \
          --dest-dir "$OUTPUT_DIR"

      # Renders are uploaded as separate release assets (not in the zip) so the README can link to them
      - name: Generate images
        run: |
          kicad-cli pcb render "$PCB_FILE" \
          --output build/render/isometric_top.png \
          --quality high \
          --use-board-stackup-colors \
          --width $IMAGE_WIDTH \
          --height $IMAGE_HEIGHT \
          --zoom $IMAGE_ZOOM \
          --rotate 315,0,45
          kicad-cli pcb render "$PCB_FILE" \
          --output build/render/isometric_bottom.png \
          --quality high \
          --use-board-stackup-colors \
          --width $IMAGE_WIDTH \
          --height $IMAGE_HEIGHT \
          --zoom $IMAGE_ZOOM \
          --rotate 315,180,135

      - name: Create GitHub release
        run: |
          # Flat zip: every generated file at the top level, no folders
          zip -j release.zip "$OUTPUT_DIR"/*
          unzip -l release.zip
          # Tag: Revision-X (git tags can't contain spaces). Title: Revision X
          gh release create "Revision-$REVISION" release.zip \
          build/render/isometric_top.png \
          build/render/isometric_bottom.png \
          --title "Revision $REVISION" \
          --target "$GITHUB_SHA" \
          --generate-notes
